<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>$title</title>
  <meta name="description" content="$description">
  <meta name="robots" content="noindex, nofollow">
  <script>
    (function () {
      var t = (location.search.match(/[?&]theme=(light|dark)/) || [])[1] || null;
      if (!t) try { t = localStorage.getItem("docs-theme"); } catch (e) {}
      if (t !== "light" && t !== "dark") t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      document.documentElement.setAttribute("data-theme", t);
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
  <link rel="icon" type="image/svg+xml" href="/_theme/favicon.svg">
  <link rel="stylesheet" href="/_theme/style.css">
  <link rel="stylesheet" href="/_theme/pygments.css">
</head>
<body class="$body_class" data-search="$search_url">
  <header class="topbar">
    <button class="icon-btn menu-btn" type="button" data-action="menu" aria-label="Open navigation">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
    <a class="brand" href="$home_url">
      <img class="brand-mark" src="/_theme/favicon.svg" alt="" width="28" height="28">
      <span class="brand-name">$site_name</span>
    </a>
    <div class="topbar-actions">
      <button class="search-trigger" type="button" data-action="search" aria-label="Search">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <span class="search-label">Search docs</span>
        <kbd class="search-kbd">Ctrl K</kbd>
      </button>
      <button class="icon-btn" type="button" data-action="theme" aria-label="Toggle dark mode">
        <svg class="i-moon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="i-sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </div>
  </header>

  <div class="layout">
    <aside class="sidebar" id="sidebar">$nav</aside>
    <main class="main" id="main">
      $eyebrow
      <article class="prose">$content</article>
      $pager
    </main>
    <aside class="toc" aria-label="On this page">$toc</aside>
  </div>
  <div class="scrim" data-action="close-menu"></div>

  <div class="search-modal" id="search" role="dialog" aria-modal="true" aria-label="Search" hidden>
    <div class="search-panel">
      <div class="search-input-row">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="search-input" type="search" placeholder="Search services, topics, APIs…" autocomplete="off" spellcheck="false">
        <kbd>Esc</kbd>
      </div>
      <div class="search-results" id="search-results"></div>
    </div>
  </div>

  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Diagram viewer" hidden>
    <div class="lb-toolbar">
      <span class="lb-caption" id="lb-caption"></span>
      <button type="button" data-lb="out" aria-label="Zoom out">−</button>
      <button type="button" data-lb="reset" aria-label="Fit to screen">Fit</button>
      <button type="button" data-lb="in" aria-label="Zoom in">+</button>
      <button type="button" data-lb="close" aria-label="Close">✕</button>
    </div>
    <div class="lb-stage" id="lb-stage"><img id="lb-img" alt="" draggable="false"></div>
    <div class="lb-hint">Scroll to zoom · Drag to pan · Double-click to fit · Esc to close</div>
  </div>

  <script src="/_theme/app.js" defer></script>
  $live_reload
</body>
</html>
